<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabelGen - Dashboard</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body class="dashboard-page">
    <div id="notification" class="notification"></div>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-logo">LabelGen</h2>
            </div>
            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="#" class="nav-link active"><i
                                class="fa-solid fa-plus-circle nav-icon"></i> Nuova Etichetta</a></li>
                    <li class="nav-item"><a href="../history/history.html" class="nav-link"><i class="fa-solid fa-history nav-icon"></i>
                            Storico Etichette</a></li>
                </ul>
                <ul class="nav-list nav-list-admin">
                    <li class="nav-item"><a href="../admin/admin.html" class="nav-link"><i
                                class="fa-solid fa-user-shield nav-icon"></i> Area Amministratore</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <i class="fa-solid fa-user-circle user-icon"></i>
                    <span class="user-name">Nome Operatore</span>
                </div>
                <button class="button button-secondary button-small"><i class="fa-solid fa-sign-out-alt"></i>
                    Esci</button>
            </div>
        </aside>

        <main class="main-content">
            <div id="admin-indicator" class="admin-indicator" style="display: none; margin-bottom: 1rem; padding: 0.75rem; background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; border-radius: 8px; font-size: 0.875rem;">
                👑 <strong>Modalità Amministratore</strong> - 
                <a href="../admin/admin.html" style="color: #fbbf24; text-decoration: underline;">Gestisci Utenti</a>
            </div>
            <h1 class="main-title">Genera Etichetta</h1>

            <div class="form-section active">

                <div class="card">
                    <div class="form-group">
                        <label class="form-label" for="data-input">Dati Codice</label>
                        <input class="preview-box" type="text" id="data-input" placeholder="URL,Json,testo ecc....">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tipo Codice</label>
                        <select class="form-select" id="type-select"></select>
                    </div>
                    <div class="empty-div">
                    <h3 class="card-title">Opzioni</h3>
                    <div id="default-options" class="options-section"></div>
                        <div class="options-separator"></div>
                        <div class="options-advanced">
                            <div class="options-advanced-header">
                                <span class="options-advanced-title">Opzioni avanzate</span>
                                <button type="button" id="toggleAdvanced" class="button button-secondary button-small">Mostra/Nascondi</button>
                            </div>
                            <div id="advanced-options" class="options-section"></div>
                        </div>
                    </div>
                </div>
            </div>
    
    </main>

    <aside class="preview-panel">
        <div class="card">
            <h3 class="card-title"><i class="fa-solid fa-image"></i> Anteprima comando </h3>
                <input type="text" class="preview-box" id="preview" >
            <div class="button-group mt-4">
                <button class="button button-icon" id="syncButton" title="Aggiorna anteprima"><i class="fa-solid fa-sync-alt"></i></button>
                <button class="button button-icon" id="printButton" title="Stampa"><i class="fa-solid fa-print"></i></button>
            </div>
        </div>
        <div class="card mt-6">
            <h3 class="card-title">Opzioni di Stampa</h3>
            <div class="form-group">
                <label for="printer" class="form-label">Stampa su:</label>
                <select id="printer" class="form-select">
                    <option>Stampa</option>
                    <option>Salva File</option>
                </select>
            </div>
            <button class="button button-success button-large button-full-width mt-4" id="printButtonSecondary"><i class="fa-solid fa-print"></i>Stampa Ora</button>
        </div>
    </aside>
    </div>

    <script src="../auth.js"></script>
    <script src="home.js"></script>
</body>

</html>
