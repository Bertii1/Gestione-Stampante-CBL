        <div class="card">
            <h3 class="card-title"><i class="fa-solid fa-image"></i> Anteprima comando </h3>
                <input type="text" class="preview-box" id="preview" >
            <div class="button-group mt-4">
                <button class="button button-icon" id="syncButton" title="Aggiorna anteprima"><i class="fa-solid fa-sync-alt"></i></button>

            </div>
        </div>

            <h3 class="card-title">Opzioni di Stampa</h3>

            </div>
