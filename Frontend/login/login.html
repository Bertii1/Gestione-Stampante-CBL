<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabelGen - Accedi</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <h1 class="login-logo">LabelGen Internal</h1>
        <form class="login-form" id="login-form">
            <div class="form-group">
                <label for="username" class="sr-only">Username</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="username" placeholder="Username" required class="form-input">
                </div>
            </div>
            <div class="form-group">
                <label for="password" class="sr-only">Password</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Password" required class="form-input password-input">
                    <span class="password-toggle">
                        <i class="fa-solid fa-eye-slash"></i>
                    </span>
                </div>
            </div>
            <input type="checkbox" id="remember_me"  value="ricordarti" class="button-primary">
            <button type="submit" id="login-button" class="button button-primary button-full-width">ACCEDI</button>
        </form>
        <p class="login-disclaimer">Accesso riservato solo al personale autorizzato.</p>
    </div>

    <script>
        const passwordToggle = document.querySelector('.password-toggle');
        const passwordInput = document.querySelector('.password-input');
        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordToggle.querySelector('i').classList.toggle('fa-eye');
            passwordToggle.querySelector('i').classList.toggle('fa-eye-slash');
        });
    </script>
    <script src="login.js"></script>
</body>
</html>
