services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stampante
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "3500:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-app}", "-p${DB_PASSWORD:-password}"]
      timeout: 20s
      retries: 10
      interval: 30s
      start_period: 40s
    networks:
      - stampante_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod   # target = stage produzione
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-stampante}
      DB_PORT: 3306
      TOKEN_SECRET: ${TOKEN_SECRET:-your-super-secret-jwt-key-change-in-production}
      TN_HOST: ${TN_HOST:-10.2.12.245}
      TN_PORT: ${TN_PORT:-100}
    ports:
      - "${APP_PORT:-800}:800"
    networks:
      - stampante_network

volumes:
  mysql_data:

networks:
  stampante_network:
    driver: bridge
