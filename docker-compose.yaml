services:
  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_DATABASE: stampante
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - my-db:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d

  app:
    build:
      context: .
      dockerfile: dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: app
      DB_PASSWORD: password
      DB_NAME: stampante
      SALT: 10
      TOKEN_SECRET: e48446454f3093b2d0d72ca9fbf87c82e802fa5090a69de9de21544a81f1b3fac66165b4a036136ffaa9a8ac08d814b61cf46d35d01cfeb64ba4fcb8c708eebd
      TN_HOST : 192.168.0.0
      TN_PORT: 100   
    ports:
      - "3000:3000"
    # Uncomment to live-mount source (requires nodemon watching files inside container)
    volumes:
      - .:/usr/src/app

volumes:
  my-db:
